name: Build Windows and Android Downloads

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: downloads-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Search and playback tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  android:
    name: ${{ matrix.name }} APK
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: tv
            task: Tv
            name: Android TV
            artifact: Layar-Android-TV
            package: com.layar.tv.debug
            label: Layar TV
          - flavor: mobile
            task: Mobile
            name: Android HP
            artifact: Layar-Android-HP
            package: com.layar.mobile.debug
            label: Layar HP
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Sync shared catalogue to Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html app.js stream-tools.js cinema.css i18n.js layar.ico android/app/src/main/assets/
      - name: Build and lint Android
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if ! gradle assemble${{ matrix.task }}Debug lint${{ matrix.task }}Debug --stacktrace; then
            find app/build -name 'lint-results-*.txt' -exec cat {} \;
            exit 1
          fi
      - name: Verify APK device label and package
        run: |
          APK="android/app/build/outputs/apk/${{ matrix.flavor }}/debug/app-${{ matrix.flavor }}-debug.apk"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" > apk-badging.txt
          grep -F "package: name='${{ matrix.package }}'" apk-badging.txt
          grep -F "application-label:'${{ matrix.label }}'" apk-badging.txt
      - name: Name Android download
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist/downloads
          cp "android/app/build/outputs/apk/${{ matrix.flavor }}/debug/app-${{ matrix.flavor }}-debug.apk" "dist/downloads/${{ matrix.artifact }}-v${VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/downloads/*.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows Laptop portable ZIP
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Package Windows app with Electron included
        run: npm run package:windows
      - name: Compress Windows download
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $name = "Layar-Windows-Laptop-v$version-x64"
          New-Item -ItemType Directory -Force dist/downloads | Out-Null
          Compress-Archive -LiteralPath "dist/windows/$name" -DestinationPath "dist/downloads/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Layar-Windows-Laptop
          path: dist/downloads/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Windows, Android TV and Android HP downloads
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Layar-*
          path: dist/downloads
          merge-multiple: true
      - name: Read release version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: Layar v${{ steps.version.outputs.value }} - Windows | Android TV | Android HP
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            ## Pilih download sesuai perangkat

            | Perangkat | File | Cara pakai |
            | --- | --- | --- |
            | **WINDOWS LAPTOP / PC x64** | `Layar-Windows-Laptop-*.zip` | Ekstrak seluruh ZIP, lalu buka **Layar.exe**. Tidak perlu Node.js/npm. |
            | **ANDROID TV / TV BOX** | `Layar-Android-TV-*.apk` | Pasang di Android TV. Nama aplikasi **Layar TV**, navigasi remote dan landscape. |
            | **ANDROID HP / TABLET** | `Layar-Android-HP-*.apk` | Pasang di HP/tablet. Nama aplikasi **Layar HP**, navigasi sentuh dan katalog portrait/landscape. |

            APK TV dan HP dibuat sebagai varian terpisah. Player video Android tetap landscape.
            Pilih tiga file di atas; arsip **Source code** ditujukan untuk pengembangan.

            Memuat UI episode dengan timeline season, scrollbar tersembunyi, serta menu resolusi dan deteksi audio HLS. Pilihan resolusi mengikuti kontrol yang tersedia di sumber. Passthrough tersedia melalui mpv pada Windows.

            APK memakai debug key CI. Jika update aplikasi lama ditolak karena tanda tangan berbeda, hapus instalasi lama dahulu (data lokal ikut terhapus).
          files: |
            dist/downloads/Layar-Windows-Laptop-*.zip
            dist/downloads/Layar-Android-TV-*.apk
            dist/downloads/Layar-Android-HP-*.apk
