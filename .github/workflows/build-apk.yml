name: Build Windows and Android Downloads

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: downloads-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Search and playback tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  android:
    name: Android TV and Mobile APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Sync shared catalogue to Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html app.js stream-tools.js cinema.css i18n.js layar.ico android/app/src/main/assets/
      - name: Build and lint Android
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug lintDebug --stacktrace
      - name: Name Android download
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/downloads/Layar-Android-TV-Mobile-v${VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Layar-Android-TV-Mobile
          path: dist/downloads/*.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows Laptop portable ZIP
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Package Windows app with Electron included
        run: npm run package:windows
      - name: Compress Windows download
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $name = "Layar-Windows-Laptop-v$version-x64"
          New-Item -ItemType Directory -Force dist/downloads | Out-Null
          Compress-Archive -LiteralPath "dist/windows/$name" -DestinationPath "dist/downloads/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Layar-Windows-Laptop
          path: dist/downloads/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish separate Windows and Android downloads
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Layar-*
          path: dist/downloads
          merge-multiple: true
      - name: Read release version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: Layar v${{ steps.version.outputs.value }} - Windows Laptop & Android
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Download sesuai perangkat:

            - **Laptop Windows x64:** `Layar-Windows-Laptop-*.zip`. Ekstrak seluruh ZIP, lalu buka **Layar.exe**. Electron sudah termasuk; tidak perlu Node.js/npm.
            - **HP Android / Android TV:** `Layar-Android-TV-Mobile-*.apk`. Pasang APK di perangkat Android. Build ini ditandatangani dengan debug key CI.

            Baru di v3.0.4:
            - Scrollbar disembunyikan tanpa mematikan scroll.
            - Detail series dengan backdrop, tab, timeline season, kartu episode dan status pernah diputar.
            - Katalog Android mendukung portrait; player tetap landscape.
            - Fokus TV memakai efek ringan tanpa blur berat.
            - Popup resolusi dan audio hasil deteksi HLS. Pilihan kualitas mengikuti API yang tersedia di player sumber.
            - Passthrough di popup laptop untuk sesi mpv berikutnya; WebView Android belum mendukung passthrough.

            Untuk APK lama yang menolak update karena tanda tangan berbeda, hapus instalasi lama sebelum memasang APK ini; data lokal ikut terhapus.
          files: |
            dist/downloads/Layar-Windows-Laptop-*.zip
            dist/downloads/Layar-Android-TV-Mobile-*.apk
