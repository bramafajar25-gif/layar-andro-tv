name: Build Android TV APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check playback regressions
        run: npm test

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Sync Web Assets to Android TV App
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/
          cp app.js android/app/src/main/assets/
          cp cinema.css android/app/src/main/assets/
          cp i18n.js android/app/src/main/assets/
          cp layar.ico android/app/src/main/assets/

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android TV APK
        working-directory: ./android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if ! gradle assembleDebug lintDebug --stacktrace > ../build.log 2>&1; then
            cat ../build.log
            echo "### ❌ Build Failure Details" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 ../build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Layar-Android-TV-APK
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Stage APK for Release
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist/apk
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} dist/apk/Layar-v3.0.2.apk \;

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v3.0.2
          name: Layar v3.0.2 (Android TV & Mobile)
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/apk/Layar-v3.0.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
