<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://image.tmdb.org https://z2.idlixku.com; connect-src 'self'; object-src 'none'; base-uri 'none'">
  <title>Layar</title>
  <link rel="icon" href="layar.ico">
  <link rel="stylesheet" href="cinema.css">
  <script defer src="i18n.js"></script>
  <script defer src="stream-tools.js"></script>
  <script defer src="episode-selector.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div id="introSplash" class="intro-splash" role="presentation" aria-hidden="true">
    <div class="intro-backdrop"></div>
    <div class="intro-content">
      <div class="intro-logo-box">
        <svg class="intro-ribbon-svg" viewBox="0 0 120 140" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="ribbonGlow" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="12" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
            <linearGradient id="ribbonStemGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#730B0F" />
              <stop offset="45%" stop-color="#B81D24" />
              <stop offset="100%" stop-color="#E50914" />
            </linearGradient>
            <linearGradient id="ribbonFootGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#E50914" />
              <stop offset="100%" stop-color="#FF2E36" />
            </linearGradient>
          </defs>
          <path d="M 28 15 H 52 V 88 H 105 V 118 H 28 Z" fill="#E50914" opacity="0.45" filter="url(#ribbonGlow)" />
          <rect x="28" y="15" width="24" height="74" fill="url(#ribbonStemGrad)" />
          <rect x="33" y="15" width="14" height="74" fill="#E50914" opacity="0.6" />
          <path d="M 28 88 H 105 L 97 118 H 28 Z" fill="url(#ribbonFootGrad)" />
          <path d="M 28 88 H 105 L 101 96 H 28 Z" fill="#FF5259" opacity="0.8" />
          <path d="M 28 88 L 52 64 V 88 Z" fill="#200003" opacity="0.88" />
        </svg>
      </div>
      <div class="intro-brand">LAYAR</div>
      <div class="intro-flare"></div>
    </div>
  </div>
  <div class="window-drag-bar" aria-hidden="true"></div>
  <svg class="svg-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 4 13 8-13 8z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
    <symbol id="i-series" viewBox="0 0 24 24"><rect width="20" height="15" x="2" y="7" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect width="20" height="20" x="2" y="2" rx="2.18" ry="2.18"/><line x1="7" x2="7" y1="2" y2="22"/><line x1="17" x2="17" y1="2" y2="22"/><line x1="2" x2="22" y1="12" y2="12"/><line x1="2" x2="7" y1="7" y2="7"/><line x1="2" x2="7" y1="17" y2="17"/><line x1="17" x2="22" y1="17" y2="17"/><line x1="17" x2="22" y1="7" y2="7"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="m12 3 1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L20 5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V5h6l2 2h10v13H3z"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M5 3v7m0 4v7M12 3v11m0 4v3M19 3v3m0 4v11M2 10h6m1 4h6m1-8h6"/></symbol>
  </defs></svg>
  <header id="nav" class="netflix-nav">
    <div class="nav-top">
      <div class="nav-brand">
        <button class="wordmark" id="home" aria-label="Layar, kembali ke beranda" data-i18n-aria-label="Layar, kembali ke beranda">
          <span class="brand-monogram">L</span>
          <span class="brand-text">LAYAR</span>
        </button>
      </div>
      <div class="nav-search-wrap">
        <div class="search" id="searchContainer" title="Cari judul · /" data-i18n-title="Cari judul · /" role="search">
          <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
          <input id="search" type="search" enterkeyhint="search" placeholder="Film, series, dan lainnya" data-i18n-placeholder="Film, series, dan lainnya" aria-label="Cari film atau series" data-i18n-aria-label="Cari film atau series" autocomplete="off">
        </div>
      </div>
      <button id="mobileSettings" class="mobile-only-btn profile" title="Pengaturan Layar" data-i18n-title="Pengaturan Layar" aria-label="Pengaturan Layar" data-i18n-aria-label="Pengaturan Layar"><span class="profile-face" aria-hidden="true"></span></button>
    </div>
    <nav class="nav-menu" aria-label="Navigasi utama" data-i18n-aria-label="Navigasi utama">
      <button data-tab="home" class="nav-item active" aria-current="page">
        <svg class="icon" aria-hidden="true"><use href="#i-home"/></svg>
        <span class="nav-label" data-i18n="Beranda">Beranda</span>
      </button>
      <button data-tab="tv_series" class="nav-item">
        <svg class="icon" aria-hidden="true"><use href="#i-series"/></svg>
        <span class="nav-label" data-i18n="Series">Series</span>
      </button>
      <button data-tab="movie" class="nav-item">
        <svg class="icon" aria-hidden="true"><use href="#i-film"/></svg>
        <span class="nav-label" data-i18n="Film">Film</span>
      </button>
      <button data-tab="list" class="nav-item">
        <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
        <span class="nav-label" data-i18n="Daftarku">Daftarku</span>
      </button>
    </nav>
    <div class="nav-end">
      <select id="language" class="language-select" aria-label="Bahasa tampilan" data-i18n-aria-label="Bahasa tampilan" title="Bahasa tampilan" data-i18n-title="Bahasa tampilan"><option value="id">ID</option><option value="en">EN</option></select>
      <button id="openFile" class="nav-icon" title="Buka file video di mpv" data-i18n-title="Buka file video di mpv" aria-label="Buka file video di mpv" data-i18n-aria-label="Buka file video di mpv"><svg class="icon" aria-hidden="true"><use href="#i-folder"/></svg><span class="nav-label" data-i18n="Buka File">Buka File</span></button>
      <button id="cinemaSettings" class="nav-icon" title="Kualitas &amp; Suara" data-i18n-title="Kualitas &amp; Suara" aria-label="Kualitas &amp; Suara" data-i18n-aria-label="Kualitas &amp; Suara"><svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg><span class="nav-label" data-i18n="Audio & Kualitas">Audio</span></button>
      <button id="settings" class="profile" title="Pengaturan Layar" data-i18n-title="Pengaturan Layar" aria-label="Pengaturan Layar" data-i18n-aria-label="Pengaturan Layar"><span class="profile-face" aria-hidden="true"></span><span class="nav-label" data-i18n="Pengaturan Layar">Pengaturan</span></button>
    </div>
  </header>
  <main tabindex="-1" id="main" aria-busy="true"></main>
  <footer><span class="footer-logo">LAYAR</span><span data-i18n="Film, series, dan waktu buat diri sendiri.">Film, series, dan waktu buat diri sendiri.</span><span class="source-label"><i></i><span data-i18n="Katalog IDLIX">Katalog IDLIX</span></span></footer>
  <div id="modal" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Detail judul" data-i18n-aria-label="Detail judul" tabindex="-1"><div id="dialog" class="dialog"></div></div>
  <section id="player" class="player hidden" aria-label="Player Layar" data-i18n-aria-label="Player Layar">
    <div class="player-top">
      <button id="playerBack" class="icon-button" aria-label="Tutup player" data-i18n-aria-label="Tutup player"><svg class="icon"><use href="#i-arrow"/></svg></button>
      <div class="player-heading"><span id="playerTitle"></span><small id="playerSubtitle"></small></div>
      <span id="streamInfo" class="player-source" data-i18n="MENYIAPKAN VIDEO">MENYIAPKAN VIDEO</span>
      <span id="audioInfo" class="subtitle-info" role="status"></span>
      <span id="subtitleInfo" class="subtitle-info" data-i18n="Subtitle: cek menu CC" title="Belum dapat memastikan sub Indo. Pilih Indonesia / Indonesian di menu CC atau Subtitle jika tersedia." data-i18n-title="Belum dapat memastikan sub Indo. Pilih Indonesia / Indonesian di menu CC atau Subtitle jika tersedia.">Subtitle: cek menu CC</span>
      <button id="playerQuality" class="icon-button" aria-label="Kualitas &amp; Suara" data-i18n-aria-label="Kualitas &amp; Suara" title="Kualitas &amp; Suara"><svg class="icon"><use href="#i-sliders"/></svg></button>
      <button id="playerSidebar" class="icon-button" aria-label="Episode" data-i18n-aria-label="Episode" title="Daftar episode" data-i18n-title="Daftar episode"><svg class="icon"><use href="#i-grid"/></svg></button>
      <button id="fullscreen" class="icon-button" aria-label="Layar penuh" data-i18n-aria-label="Layar penuh"><svg class="icon"><use href="#i-expand"/></svg></button>
    </div>
    <div class="player-layout">
      <div class="player-left"><div id="playerSurface" class="player-surface"><div id="playerMessage" class="player-message"><span class="spinner"></span><p data-i18n="Menyiapkan ruang tonton…">Menyiapkan ruang tonton…</p></div></div><div class="player-bottom"><span id="playerNote" role="status" data-i18n="Menyiapkan sesi pemutaran.">Menyiapkan sesi pemutaran.</span><button id="nativePlayer" class="text-button" disabled title="Menunggu alamat stream dari sumber" data-i18n-title="Menunggu alamat stream dari sumber" data-i18n="Putar di mpv ↗">Putar di mpv ↗</button><button id="retryPlayer" class="text-button" data-i18n="Muat ulang">Muat ulang</button><button id="openSource" class="text-button" data-i18n="Buka sumber ↗">Buka sumber ↗</button></div></div>
      <aside id="playerAside" class="player-aside"><div class="aside-heading"><span class="eyebrow" data-i18n="LANJUT KE EPISODE BERIKUTNYA">LANJUT KE EPISODE BERIKUTNYA</span><h2 data-i18n="Episode">Episode</h2><select id="playerSeason" aria-label="Season player" data-i18n-aria-label="Season player"></select></div><div id="playerEpisodes" class="player-episodes"></div></aside>
    </div>
  </section>
  <div id="toast" role="status"></div>
</body>
</html>
